<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword,
         signOut, updatePassword, updateEmail, deleteUser, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAW7noTqq51oCUfEEWot8IEG00RHAdhuic",
  authDomain: "toeic-study-fac17.firebaseapp.com",
  databaseURL: "https://toeic-study-fac17-default-rtdb.firebaseio.com",
  projectId: "toeic-study-fac17",
  storageBucket: "toeic-study-fac17.firebasestorage.app",
  messagingSenderId: "884792704448",
  appId: "1:884792704448:web:a1ca1c57edd9c222cd1c25",
  measurementId: "G-TD9Y55L28J"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// コーチ（島端さん）のログイン用アドレス。ご本人のGmailをそのまま使う。
const COACH_EMAIL = 'g1522407@gmail.com';

window._db = {
  async get(path) {
    const snap = await get(ref(db, path));
    return snap.exists() ? snap.val() : null;
  },
  async set(path, val) { await set(ref(db, path), val); },
  async remove(path) { await remove(ref(db, path)); },
  listen(path, cb) {
    onValue(ref(db, path), snap => cb(snap.exists() ? snap.val() : null));
  }
};

// 名前から、ログインに使う内部アドレスを作る（生徒には見えない・入力もしない）
// 名前をそのまま使えない（記号や長さの制限がある）ため、ハッシュ化して固定長にする
async function nameToEmail(name) {
  const buf = new TextEncoder().encode('toeic-study:' + String(name).trim());
  const hash = await crypto.subtle.digest('SHA-256', buf);
  const hex = [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
  return 'u' + hex.slice(0, 40) + '@toeic-study.local';
}

window._auth = {
  COACH_EMAIL,
  onReady(cb) { onAuthStateChanged(auth, u => cb(u)); },
  current() { return auth.currentUser; },
  isCoach() { return !!auth.currentUser && auth.currentUser.email === COACH_EMAIL; },
  async signUp(name, pw) { await createUserWithEmailAndPassword(auth, await nameToEmail(name), pw); },
  async signIn(name, pw) { await signInWithEmailAndPassword(auth, await nameToEmail(name), pw); },
  async signInCoach(pw) { await signInWithEmailAndPassword(auth, COACH_EMAIL, pw); },
  async signOutNow() { await signOut(auth); },
  async sendCoachReset() { await sendPasswordResetEmail(auth, COACH_EMAIL); },
  async changePassword(pw) { await updatePassword(auth.currentUser, pw); },
  async changeLoginName(newName) { await updateEmail(auth.currentUser, await nameToEmail(newName)); },
  async deleteMe() { await deleteUser(auth.currentUser); },
  // 移行用：別インスタンスでアカウントを作る（コーチのログインを保ったまま実行するため）
  async createFor(name, pw) {
    const app2 = initializeApp(firebaseConfig, 'migrate-' + Math.floor(performance.now() * 1000));
    const auth2 = getAuth(app2);
    try { await createUserWithEmailAndPassword(auth2, await nameToEmail(name), pw); }
    finally { try { await signOut(auth2); } catch (e) {} }
  }
};
window._dbReady = true;
document.dispatchEvent(new Event('db-ready'));
</script>

function authErrMsg(e){
  const c=(e&&e.code)||'';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials')
    return '名前かパスワードが違います。はじめての方は「はじめて使う方はこちら」から登録してください。';
  if(c==='auth/too-many-requests')return '試行の回数が多すぎます。少し時間をおいてからお試しください。';
  if(c==='auth/network-request-failed')return '通信エラーです。電波の良い場所でもう一度お試しください。';
  if(c==='auth/operation-not-allowed'||c==='auth/configuration-not-found')return 'ログイン機能がまだ有効になっていません。コーチに連絡してください。';
  return 'ログインできませんでした（'+c+'）';
}

// 移行期間中のみ：Authにまだアカウントが無い生徒を、旧パスワードで受け入れて自動移行する
// 戻り値 'ok'=移行して入れた / 'short'=本人確認はできたがパスワードが短い / 'no'=該当なし
async function tryLegacyLogin(name,pw){
  let stored=null;
  try{stored=await db().get(`students/${name}/password`);}catch(e){return 'no';}
  if(!stored||stored!==pw)return 'no';
  if(String(pw).length<6)return 'short';
  try{
    await window._auth.signUp(name,pw);
    await db().set(`students/${name}/auth`,true);
    await db().remove(`students/${name}/password`);
    return 'ok';
  }catch(e){return 'no';}
}

function daysSinceLast(name){
  const pre=name+'/';
  let last='';
  for(const k of Object.keys(allData)){
    if(k.indexOf(pre)!==0)continue;
    const d=k.slice(pre.length);
    const v=allData[k]||{};
    let t=0;for(const c of CATS)t+=Number(v[c.key]||0);
    if(t>0&&d>last)last=d;
  }
  if(!last)return null;
  const p=last.split('-').map(Number);
  const a=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const b=new Date(p[0],p[1]-1,p[2]);
  return{last:last,days:Math.round((a-b)/86400000)};
}
// 連続記録日数（今日または昨日から遡って、0分より多く記録した日が続いた数）
function streakDays(name){
  const pre=name+'/';const set=new Set();
  for(const k of Object.keys(allData)){
    if(k.indexOf(pre)!==0)continue;
    const v=allData[k]||{};let t=0;for(const c of CATS)t+=Number(v[c.key]||0);
    if(t>0)set.add(k.slice(pre.length));
  }
  const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const fmt=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  if(!set.has(fmt(d)))d.setDate(d.getDate()-1);
  let n=0;
  while(set.has(fmt(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
// 直近7日でまったく手をつけていないカテゴリ（他はやっている場合のみ）
function zeroCat(name){
  const sums={};let total=0;
  for(const c of CATS)sums[c.key]=0;
  const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  for(let i=0;i<7;i++){
    const k=`${name}/${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const v=allData[k]||{};
    for(const c of CATS){const x=Number(v[c.key]||0);sums[c.key]+=x;total+=x;}
    d.setDate(d.getDate()-1);
  }
  if(total<60)return null;
  const z=CATS.filter(c=>sums[c.key]===0);
  return z.length&&z.length<CATS.length?z[Math.floor(Math.random()*z.length)]:null;
}

  if(r&&r.days>=2)return{kind:'worry',v:{days:r.days},act:'day'};

  const ym=ymStr(curYear,curMonth);
  const g=getGoal(myName,curYear,curMonth);
  const tH=Number(g.hours||0);
  if(tH>0&&getStudentMonthTotal(myName,curYear,curMonth)>=tH*60&&localStorage.getItem('charaClear')!==ym){
    localStorage.setItem('charaClear',ym);return{kind:'clear',v:{}};
  }
  if(now.getDate()<=3&&!tH)return{kind:'goal',v:{},act:'goal'};
  const z=zeroCat(myName);
  if(z)return{kind:'zero',v:{cat:z.label}};
  return null;
}

function buildRanking(){
  const ranges=[['week','今週'],['month','今月'],['3month','3ヶ月'],['6month','半年'],['all','全期間']];
  const rangeHtml=`<div class="rank-range">${ranges.map(([k,l])=>`<button class="rrtab ${rankRange===k?'active':''}" onclick="setRankRange('${k}')">${l}</button>`).join('')}</div>`;
  const today=new Date();today.setHours(0,0,0,0);
  let cutoff,periodLabel;
  const y=today.getFullYear(),m=today.getMonth();
  if(rankRange==='week'){const d=new Date(today);d.setDate(d.getDate()-d.getDay());cutoff=d.getTime();periodLabel='';}
  else if(rankRange==='month'){cutoff=new Date(y,m,1).getTime();periodLabel='';}
  else if(rankRange==='3month'){let qm;if(m>=3){qm=m>=9?9:m>=6?6:3;}else{qm=0;}cutoff=new Date(y,qm,1).getTime();periodLabel=`${qm+1}月〜${qm+3}月`;}
  else if(rankRange==='all'){cutoff=0;periodLabel='全期間';}
  else{if(m>=3&&m<=8){cutoff=new Date(y,3,1).getTime();periodLabel='4月〜9月';}else if(m>=9){cutoff=new Date(y,9,1).getTime();periodLabel='10月〜3月';}else{cutoff=new Date(y-1,9,1).getTime();periodLabel='10月〜3月';}}
  const totals={};
  for(const[key,data]of Object.entries(allData)){
    const parts=key.split('/');const name=parts[0];const dateStr=parts.slice(1).join('/');
    const ts=new Date(dateStr).getTime();if(isNaN(ts)||ts<cutoff)continue;
    if(!totals[name])totals[name]=0;
    for(const c of CATS)totals[name]+=Number(data[c.key]||0);
  }
  const ranked=Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const maxMin=ranked.length?ranked[0][1]:1;
  const myRank=ranked.findIndex(([n])=>n===myName)+1;
  const totalPpl=ranked.length;const totalMin=ranked.reduce((s,[,v])=>s+v,0);
  const statsHtml=`<div class="rank-stats">
    <div class="rstat"><div class="rstat-val">${totalPpl}</div><div class="rstat-lbl">参加人数</div></div>
    <div class="rstat"><div class="rstat-val">${fmtMin(totalMin)}</div><div class="rstat-lbl">みんなの合計</div></div>
    <div class="rstat"><div class="rstat-val">${myRank>0?myRank+'位':'--'}</div><div class="rstat-lbl">自分の順位</div></div>
  </div>${periodLabel?`<div style="text-align:center;font-size:12px;color:var(--text3);margin:-4px 0 8px">📅 ${periodLabel}の合計</div>`:''}`;
  const medals=['🥇','🥈','🥉'];
  const listHtml=ranked.length===0
    ?`<div style="text-align:center;padding:40px 0;color:var(--text2);font-size:14px">この期間の記録がまだありません</div>`
    :`<div class="rank-list">${ranked.map(([name,min],i)=>{
      const isMe=name===myName;const pct=Math.round(min/maxMin*100);const num=i<3?medals[i]:`${i+1}`;
      return`<div class="rank-item ${isMe?'me':''}"><span class="rank-num">${num}</span><span class="rank-name">${name}${isMe?' 👈':''}</span><div class="rank-bar-bg"><div class="rank-bar-fg" style="width:${pct}%"></div></div><span class="rank-time">${fmtMin(min)}</span></div>`;
    }).join('')}</div>`;
  return rangeHtml+statsHtml+listHtml;
}

// ── コーチ：要フォローの抽出 ──────────────────────────────
function weekTotal(name,offset){
  let t=0;const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  d.setDate(d.getDate()-offset*7);
  for(let i=0;i<7;i++){
    const k=`${name}/${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const v=allData[k]||{};for(const c of CATS)t+=Number(v[c.key]||0);
    d.setDate(d.getDate()-1);
  }
  return t;
}
function followList(){
  const out=[];
  for(const n of allStudents()){
    const r=daysSinceLast(n);
    if(!r){out.push({n:n,lv:2,tag:'記録なし',msg:'まだ一度も記録がありません',
      line:`${n}さん、こんにちは。アプリの学習記録がまだ入っていないようです。使い方で困っているところがあれば遠慮なく教えてください。`});continue;}
    if(r.days>=3){out.push({n:n,lv:3,tag:r.days+'日未入力',msg:`最後の記録から${r.days}日空いています`,
      line:`${n}さん、おつかれさまです。${r.days}日ほど記録が空いているようですが、忙しかったですか？5分でも大丈夫なので、また今日から記録を再開していきましょう。`});continue;}
    const tw=weekTotal(n,0),lw=weekTotal(n,1);
    if(lw>=60&&tw<lw*0.4){out.push({n:n,lv:2,tag:'失速',msg:`今週${fmtMin(tw)}（先週${fmtMin(lw)}）`,
      line:`${n}さん、おつかれさまです。今週は${fmtMin(tw)}と、先週の${fmtMin(lw)}から少しペースが落ちているようです。何か詰まっているところがあれば聞かせてください。`});continue;}
    const g=getGoal(n,coachYear,coachMonth),tH=Number(g.hours||0);
    if(tH>0){
      const days=getDays(coachYear,coachMonth);
      const passed=(coachYear===now.getFullYear()&&coachMonth===now.getMonth())?now.getDate():days;
      const should=tH*60*passed/days,got=getStudentMonthTotal(n,coachYear,coachMonth);
      if(should>0&&got<should*0.7){
        const need=Math.max(0,Math.round((tH*60-got)/Math.max(1,days-passed)));
        out.push({n:n,lv:1,tag:'ペース遅れ',msg:`目標${tH}hに対し${fmtMin(got)}（${Math.round(got/should*100)}%ペース）`,
          line:`${n}さん、おつかれさまです。今月の目標${tH}時間に対して現在${fmtMin(got)}です。残りの日数だと1日あたり${need}分ペースになります。無理そうなら目標のほうを見直しましょう。`});
      }
    }
  }
  return out.sort((a,b)=>b.lv-a.lv);
}
function buildFollowPanel(){
  followCache=followList();
  const rows=followCache.length
    ? followCache.map((f,i)=>`<div class="fw-item">
        <span class="fw-tag ${f.lv>=3?'fw-red':'fw-amb'}">${f.tag}</span>
        <span class="fw-nm">${f.n}</span>
        <span class="fw-msg">${f.msg}</span>
        <button class="fw-copy" onclick="copyFollow(${i})">文面</button>
      </div>`).join('')
    : `<div class="fw-none">いま声をかけたほうがよい生徒はいません 👍</div>`;
  return`<div class="fw-box">
    <div class="fw-head">🔔 要フォロー ${followCache.length?`（${followCache.length}名）`:''}</div>
    ${rows}
  </div>`;
}
async function copyFollow(i){
  const f=followCache[i];if(!f)return;
  try{await navigator.clipboard.writeText(f.line);alert('声かけの文面をコピーしました。\n\n'+f.line);}
  catch(e){prompt('この文面をコピーしてください',f.line);}
}

// ── 旧方式からの移行（コーチ画面） ─────────────────────────
function buildMigratePanel(){
  const pending=allStudents().filter(n=>roster[n]&&roster[n].legacyPw);
  if(!pending.length&&!migrateMsg)return'';
  return`<div class="mig-box">
    ${pending.length?`<div class="mig-title">⚠️ 移行が必要な生徒が ${pending.length}人 います</div>
    <div class="mig-sub">パスワードがデータベースに保存されたままの生徒です。ログイン用アカウントを作り、保存されたパスワードを削除します。</div>
    <button class="btn-sm" onclick="doMigrateAll()">🔐 まとめて移行する</button>`:''}
    ${migrateMsg?`<div class="mig-msg">${migrateMsg}</div>`:''}
  </div>`;
}

async function doMigrateAll(){
  const pending=allStudents().filter(n=>roster[n]&&roster[n].legacyPw);
  if(!pending.length)return;
  if(!confirm(`${pending.length}人分のログインアカウントを作成します。\nパスワードは今のものがそのまま引き継がれます。`))return;
  let ok=0;const short=[],fail=[];
  migrateMsg='移行中…';render();
  for(const n of pending){
    const pw=roster[n].legacyPw;
    if(String(pw).length<6){short.push(n);continue;}
    try{
      await window._auth.createFor(n,pw);
      await db().set(`students/${n}/auth`,true);
      await removeLegacyPw(n);ok++;
    }catch(e){
      if((e&&e.code)==='auth/email-already-in-use'){
        await db().set(`students/${n}/auth`,true);await removeLegacyPw(n);ok++;
      }else fail.push(esc(n)+'（'+((e&&e.code)||'不明')+'）');
    }
  }
  let m=`✅ ${ok}人の移行が完了しました。`;
  if(short.length)m+=`<br><br>⚠️ パスワードが6文字未満のため移行できませんでした：${short.map(esc).join('、')}<br>各カードの「仮パスワード発行」で新しいパスワードを設定し、本人に伝えてください。`;
  if(fail.length)m+=`<br><br>❌ 失敗：${fail.join('、')}`;
  migrateMsg=m;
  try{await loadAll();}catch(e){}
  render();
}

async function doIssueTempPw(name){
  const pw=prompt(`「${name}」の仮パスワードを入力してください（6文字以上）。\n設定したあと、本人に伝えてください。`);
  if(!pw)return;
  if(pw.length<6){alert('6文字以上にしてください');return;}
  try{await window._auth.createFor(name,pw);}
  catch(e){
    const c=(e&&e.code)||'不明';
    alert(c==='auth/email-already-in-use'?'この生徒はすでにログイン用アカウントを持っています。':'設定できませんでした（'+c+'）');
    return;
  }
  await db().set(`students/${name}/auth`,true);
  await removeLegacyPw(name);
  try{await loadAll();}catch(e){}
  migrateMsg=`「${esc(name)}」の仮パスワードを設定しました。本人に伝えてください。`;
  render();
}

// ── COACH DASHBOARD ────────────────────────────────────────
function buildCoach(){
  const students=allStudents();
  const recorded=students.filter(n=>getStudentMonthTotal(n,coachYear,coachMonth)>0).length;
  const avgMin=students.length?Math.round(students.reduce((s,n)=>s+getStudentMonthTotal(n,coachYear,coachMonth),0)/students.length):0;
  let cards=students.length===0
    ?`<div class="empty-txt">まだデータがありません。<br>生徒がアプリを開いて記録すると<br>ここに表示されます。</div>`
    :students.map(n=>buildStudentCard(n,coachYear,coachMonth)).join('');
  return`
    <div class="topbar">
      <div><div class="topbar-title">コーチビュー</div><div class="topbar-sub">全生徒の進捗確認</div></div>
      <button class="icon-btn" onclick="doLogout()">ログアウト</button>
    </div>
    ${buildMigratePanel()}
    ${buildFollowPanel()}
    <div class="mnav-row">
      <button class="mnav-btn" onclick="coachPrev()">◀</button>
      <span class="mnav-title">${coachYear}年 ${MN[coachMonth]}</span>
      <button class="mnav-btn" onclick="coachNext()">▶</button>
    </div>
    <div class="coach-stats">
      <div class="cstat"><div class="cstat-val">${students.length}</div><div class="cstat-lbl">生徒数</div></div>
      <div class="cstat"><div class="cstat-val">${recorded}</div><div class="cstat-lbl">記録あり</div></div>
      <div class="cstat"><div class="cstat-val">${fmtMin(avgMin)}</div><div class="cstat-lbl">平均学習</div></div>
    </div>
    <div class="coach-list">${cards}</div>
  `;
}

function buildStudentCard(name,y,m){
  const g=getGoal(name,y,m);const tH=Number(g.hours||0);
  const dMin=getStudentMonthTotal(name,y,m);
  const pct=tH>0?Math.min(100,Math.round(dMin/60/tH*100)):0;
  const col=pct>=100?'var(--green)':pct>=50?'var(--amber)':'var(--blue)';
  const days=Object.keys(getStudentMonthData(name,y,m)).length;
  let cats='';
  for(const c of CATS){
    const md=getStudentMonthData(name,y,m);let t=0;
    for(const v of Object.values(md))t+=Number(v[c.key]||0);
    if(t>0)cats+=`<span class="sc-cat" style="color:${c.color}">${c.label} ${fmtMin(t)}</span>`;
  }
  const r=roster[name]||{};
  const badge=r.auth?`<span class="lock-badge">🔒 ログイン設定済</span>`
    :r.legacyPw?`<span class="nolock-badge">⚠️ 移行が必要</span>`
    :`<span class="nolock-badge">⚠️ 未登録</span>`;
  return`<div class="sc">
    <div onclick="openDetail('${name}')" style="cursor:pointer">
      <div class="sc-top">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="sc-name">${name}</div>
          ${badge}
        </div>
        <div class="sc-score">目標 ${g.score||'--'}点</div>
      </div>
      <div class="sc-prog-wrap"><div class="sc-prog" style="width:${pct}%;background:${col}"></div></div>
      <div class="sc-meta">${fmtMin(dMin)} / 目標${tH>0?tH+'h':'未設定'} ｜ ${days}日記録 ｜ 達成率 ${pct}%</div>
      <div class="sc-cats" style="margin-top:6px">${cats||'<span class="sc-cat" style="color:var(--text3)">まだ記録なし</span>'}</div>
    </div>
    <div class="sc-actions">
      <button class="btn-sm" onclick="openDetail('${name}')">📅 詳細</button>
      ${r.auth?`<button class="btn-sm" onclick="doForgotPwHelp('${name}')">🔑 PWを忘れた時</button>`
             :`<button class="btn-sm btn-sm-red" onclick="doIssueTempPw('${name}')">🔑 仮パスワード発行</button>`}
    </div>
  </div>`;
}

function doForgotPwHelp(name){
  alert(`「${name}」がパスワードを忘れた場合の手順\n\n`+
    `1. Firebaseコンソール →「Authentication」→ ユーザー一覧を開く\n`+
    `2. 該当のユーザーを削除する\n`+
    `3. 生徒に、同じ名前で「はじめて使う方はこちら」から登録し直してもらう\n\n`+
    `この手順で、これまでの学習記録はそのまま残ります。`);
}

function buildCoachDetail(){
  const name=detailStudent;
  return`
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="back-btn" onclick="backToCoach()">← 一覧</button>
        <div><div class="topbar-title">${name}</div><div class="topbar-sub">${coachYear}年 ${MN[coachMonth]}</div></div>
      </div>
    </div>
    <div style="padding:12px 16px 4px">${buildGoalBar(name,coachYear,coachMonth,false)}</div>
    ${buildSummary(name,coachYear,coachMonth)}
    ${buildCalendar(name,coachYear,coachMonth,true)}
  `;
}

function bindEvents(){
  if(page==='setup'){
    document.getElementById('nameInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('pwInput')?.focus();});
    document.getElementById('pwInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLoginSubmit();});
  }
  if(page==='signup'){
    document.getElementById('nameInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('pw1')?.focus();});
    document.getElementById('pw1')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('pw2')?.focus();});
    document.getElementById('pw2')?.addEventListener('keydown',e=>{if(e.key==='Enter')doSignup();});
  }
  if(page==='upgrade_pw'){
    document.getElementById('pw1')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('pw2')?.focus();});
    document.getElementById('pw2')?.addEventListener('keydown',e=>{if(e.key==='Enter')doUpgradePw();});
  }
  if(page==='coach_login')document.getElementById('pwInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')doCoachLogin();});
  if(modalDay)for(const c of CATS)document.getElementById('inp_'+c.key)?.addEventListener('input',updateTotal);
}

function updateTotal(){
  let t=0;for(const c of CATS)t+=Number(document.getElementById('inp_'+c.key)?.value||0);
  const el=document.getElementById('totalVal');if(el)el.textContent=fmtMin(t);
}

function prevMonth(){if(curMonth===0){curYear--;curMonth=11;}else curMonth--;render();}
function nextMonth(){if(curMonth===11){curYear++;curMonth=0;}else curMonth++;render();}
function jumpMonth(m){curMonth=m;render();}
function coachPrev(){if(coachMonth===0){coachYear--;coachMonth=11;}else coachMonth--;render();}
function coachNext(){if(coachMonth===11){coachYear++;coachMonth=0;}else coachMonth++;render();}
function openDay(ds){modalDay=ds;showGoalModal=false;render();}
function closeModal(){modalDay=null;render();}
function openGoalModal(){showGoalModal=true;modalDay=null;render();}
function closeGoalModal(){showGoalModal=false;render();}
function goCoachLogin(){page='coach_login';coachPwError='';render();}
function backToStudent(){page=myName&&myAuth?'student':'setup';render();}
function openDetail(name){detailStudent=name;page='coach_detail';render();}
function backToCoach(){page='coach';render();}

async function doSaveDay(){
  document.getElementById('saveBtn').disabled=true;
  const data={};let t=0;
  for(const c of CATS){const v=Number(document.getElementById('inp_'+c.key)?.value||0);data[c.key]=v;t+=v;}
  await saveStudyDay(myName,modalDay,data);
  modalDay=null;
  if(t>0&&myCharaId){
    const s=streakDays(myName);
    if(s>=3&&Math.random()<0.7)openChara({kind:'streak',v:{streak:s}});
    else openChara({kind:'praise',v:{min:fmtMin(t),month:fmtMin(getStudentMonthTotal(myName,curYear,curMonth))}});
  }
  render();
}
async function doDeleteDay(){await deleteStudyDay(myName,modalDay);modalDay=null;render();}
async function doSaveGoal(){
  const g={score:document.getElementById('g_score').value,hours:document.getElementById('g_hours').value};
  await saveGoal(myName,ymStr(curYear,curMonth),g);showGoalModal=false;render();
}

// ── 起動 ──────────────────────────────────────────────────
// ログイン状態が確定してから画面を出す。前回ログインしていれば、そのまま入れる。
function boot(){
  let done=false;
  window._auth.onReady(async user=>{
    if(done)return;done=true;
    showApp();
    if(user&&window._auth.isCoach()){
      try{await loadAll();page='coach';}
      catch(e){await window._auth.signOutNow();page='setup';}
    }else if(user){
      const n=localStorage.getItem('myName')||'';
      if(!n){try{await window._auth.signOutNow();}catch(e){}page='setup';}
      else{
        myName=n;myAuth=true;
        try{await loadAll();page='student';}
        catch(e){myAuth=false;setupErr='データを読み込めませんでした。もう一度ログインしてください。';try{await window._auth.signOutNow();}catch(e2){}page='setup';}
      }
    }else{
      page='setup';
    }
    render();
  });
}
if(window._dbReady){boot();}
else{document.addEventListener('db-ready',boot);}
